name: Unity Build and Release 🚀

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (format: v1.2.3)'
        required: true
        type: string
  # [push, pull_request]

jobs:
  validate-version:
    name: Validate Version Format
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.check-version.outputs.is_valid }}
      version: ${{ github.event.inputs.version }}
    steps:
      - name: Check version format
        id: check-version
        run: |
          if [[ "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version format is valid"
            echo "is_valid=true" >> $GITHUB_OUTPUT
          else
            echo "Invalid version format. Must be in the format v1.2.3"
            echo "is_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
  # iOS Build Job (starts after Android build completes)
  build-ios:
    name: Build for iOS
    runs-on: macos-latest-xlarge
    timeout-minutes: 75
    needs: validate-version
    if: needs.validate-version.outputs.is_valid == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          
      - name: Free up disk space on macOS runner
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /Applications/Xcode_*/Contents/Developer/Platforms/iPhoneSimulator.platform
          sudo rm -rf /Library/Developer/CoreSimulator
          sudo rm -rf /Users/runner/Library/Developer/CoreSimulator
          sudo rm -rf /Users/runner/Library/Caches/*
          sudo rm -rf /Users/runner/Library/Developer/Xcode/DerivedData/*
          sudo rm -rf /private/var/folders/*
          echo "After cleanup:"
          df -h

      - name: Restore Library cache 🔄️
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Build project 🏗️
        id: build_unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: ${{ env.UNITY_VERSION }}
          versioning: Custom
          version: ${{ needs.validate-version.outputs.version }}

      - name: Upload Build Artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: iOS-${{ needs.validate-version.outputs.version }}
          path: build/iOS
          compression-level: 0
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, build-ios]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: false

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.version }}
          name: Release ${{ needs.validate-version.outputs.version }}
          draft: false
          prerelease: false
          files: builds/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
